name: Metrix jobs

on: push

jobs:
  
  build:
   runs-on: ubuntu-latest

   strategy:
     
     matrix:
      
      node-version: [14,16,18]

   steps:
     - uses: actions/checkout@v4
     - name: Use node.js {{ matrix.node-version }}
       uses: actions/setup-node@v4

       with:
        node-version: ${{matrix.node-version}}
     - run: node -v  